<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Reader – TNPSC Study Library</title>
  <meta name="description" content="Read Tamil Nadu school textbooks online with the TNPSC Study Library reader.">
  <meta name="theme-color" content="#3a3f4c">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/reader.css">
</head>
<body>
  <a class="skip-link" href="#scroller">Skip to reader content</a>

  <div class="reader-app" id="readerApp">

    <!-- Top bar -->
    <header class="reader-header">
      <button type="button" class="icon-btn rd" id="backBtn" aria-label="Back to library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <h1 class="rd-title" id="rdTitle">Book<span class="rd-sub" id="rdSub"></span></h1>
      <button type="button" class="icon-btn rd" id="searchBtn" aria-label="Search in book">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button type="button" class="icon-btn rd js-theme-toggle" aria-label="Toggle dark mode"></button>
      <button type="button" class="icon-btn rd" id="moreBtn" aria-label="More options" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>

    <!-- Search panel -->
    <div class="search-panel" id="searchPanel" style="display:none">
      <form id="searchForm">
        <label class="sr-only" for="searchInput">Search text in this book</label>
        <input id="searchInput" type="search" placeholder="Search within this book" autocomplete="off" enterkeyhint="search">
        <button type="button" class="icon-btn rd" id="searchClose" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </form>
      <div class="search-meta">
        <span class="search-status" id="searchStatus" aria-live="polite"></span>
        <span class="search-nav">
          <button type="button" class="icon-btn" id="searchPrev" aria-label="Previous match">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button type="button" class="icon-btn" id="searchNext" aria-label="Next match">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </span>
      </div>
    </div>

    <!-- Overflow menu -->
    <div class="more-menu" id="moreMenu" style="display:none" role="menu">
      <button type="button" class="menu-item" id="menuSource" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>
        Open Official Source
      </button>
      <div class="divider"></div>
      <button type="button" class="menu-item" id="fullBtn2" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
        Fullscreen
      </button>
    </div>

    <!-- Page scroller -->
    <main class="reader-scroller" id="scroller" tabindex="-1">
      <div class="spool" id="spool" style="display:none" aria-label="Book pages"></div>

      <!-- Loading -->
      <div class="loading-panel" id="loadingPanel">
        <div class="spinner" aria-hidden="true"></div>
        <p id="spinnerText">Loading book…</p>
      </div>

      <!-- No PDF configured -->
      <div class="no-pdf-panel" id="noPdfPanel" style="display:none">
        <span class="emoji" aria-hidden="true">📕</span>
        <strong id="noPdfTitle">Book</strong>
        <p class="offline-hint">PDF link not configured.</p>
        <button type="button" class="btn btn-primary" id="noPdfBack">Back to Library</button>
        <button type="button" class="btn btn-ghost" id="noPdfSource">Open Official Source</button>
      </div>

      <!-- Error -->
      <div class="error-panel" id="errorPanel" style="display:none"></div>
    </main>

    <!-- Bottom controls -->
    <nav class="reader-controls" aria-label="Reader controls">
      <div class="ctl-row">
        <button type="button" class="icon-btn rd" id="zoomOut" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <span class="ctl-output" id="zoomLevel" role="status" aria-live="polite">100%</span>
        <button type="button" class="icon-btn rd" id="zoomIn" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span class="ctl-output" id="fitBtn" role="button" tabindex="0" aria-label="Fit width">Fit</span>
        <button type="button" class="icon-btn rd" id="fullBtn" aria-label="Enter fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
        </button>
      </div>
      <div class="ctl-row">
        <button type="button" class="icon-btn rd" id="prevBtn" aria-label="Previous page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <label class="page-indicator">
          <span class="sr-only">Current page</span>
          <input type="number" id="pageInput" min="1" value="1" inputmode="numeric">
          <span id="totalLabel"> / 1</span>
        </label>
        <button type="button" class="icon-btn rd" id="nextBtn" aria-label="Next page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </nav>

  </div>

  <div class="offline-banner" role="status" aria-live="polite"></div>

  <script src="assets/js/books-data.js"></script>
  <script src="pdfjs/pdf.min.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/reader.js"></script>
</body>
</html>
